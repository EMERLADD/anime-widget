plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.animewidget.maid'
    compileSdk 35

    defaultConfig {
        applicationId 'com.animewidget.maid'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.2.2'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

chaquopy {
    defaultConfig {
        version '3.13'
        buildPython '/data/data/com.termux/files/home/py313/bin/python3.13'
        pip {
            install 'pillow'
            install 'requests'
            install 'geopy'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
